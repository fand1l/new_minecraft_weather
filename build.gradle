plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Only add repositories here when depending on other mods.
	// Loom already adds the Minecraft / Fabric repositories automatically.
}

loom {
	// The mod is "both": common code holds the server-authoritative weather simulation,
	// the client source set holds rendering only. Split source sets keep that boundary
	// enforced by the compiler instead of by convention.
	splitEnvironmentSourceSets()

	mods {
		"vibe_weather" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// NOTE: no `mappings` line on purpose.
	// Loom 1.17 supplies the default (Mojang official) mappings, which is what the
	// upstream FabricMC 26.2 template does. Adding a yarn mappings dependency here
	// would change every Minecraft class name used by this project.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	// Without this, Gradle compiles using whatever JVM it happens to be running on. On a system
	// where the default java-25 package is the JRE, that JVM has no compiler and compileJava fails
	// with "does not provide the required capabilities: [JAVA_COMPILER]" even though a perfectly
	// good JDK 25 is installed elsewhere -- Gradle's own provisioned toolchain, for instance.
	// Naming the toolchain makes Gradle go and find (or download) a JDK instead.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
